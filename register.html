<!DOCTYPE html>
<html>
    <head>
        <title>KARTAVYA - Register</title>
        <link rel="stylesheet" href="/static/css/style.css">
    </head>
    <body>
        <header>
            <h1>Create Your Account</h1>
            <p>Join the KARTAVYA Community</p>
        </header>
        <main>
            <form id="registerForm" method="POST" action="/register">
                <label>Full Name:</label>
                <input type="text" id="fullName" name="full_name" placeholder="Enter your full name" required>
                <br><br>
                <label>Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
                <br><br>
                <label>Password:</label>
                <input type="password" id="password" name="password" placeholder="Create a password" required>
                <br><br>
                <label>Confirm Password:</label>
                <input type="password" id="ConfirmPassword" name="confirm_password" placeholder="Confirm your password" required>
                <br><br>
                <button type="submit">Register</button>
            </form>

            <p id="formMessage">Already have an account? <a href="/templates/login.html">Login here</a></p>
            <p><a href="/">Back to Home</a></p>
        </main>
        <script src="/static/js/register.js"></script>
    </body>
</html>
