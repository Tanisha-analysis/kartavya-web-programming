<!DOCTYPE html>
<html>
    <head>
        <title>KARTAVYA - Civic Voice</title>
        <link rel="stylesheet" href="/static/css/style.css">
    </head>
    <body>
        <header>
            <h1>Civic Voice</h1>
            <p>Your Voice. Your Community. Your Responsibility.</p>
        </header>
        <main>
            <section>
                <h2>Report a civic Issue</h2>
                <p>Help improve your community by reporting local problems.</p>
                <form id="civicForm" method="post" action="/civic_voice">
                    <label>Your Name:</label>
                    <input type="text" id="citizenName" placeholder="Enter your name" required>
                    <br><br>
                    <label>Issue Type:</label>
                    <select id="issueType" required>
                        <option value="">Select issue Type</option>
                        <option value="Road Damage">Road Damage</option>
                        <option value="Water Supply">Water Supply</option>
                        <option value="Garbage">Garbage</option>
                        <option value="Street Lights">Street Light</option>
                        <option value="Other">Other</option>
                    </select>
                    <br><br>
                    <label>Issue Description:</label>
                    <textarea id="issueDescription" placeholder="Describe the civic issue" required></textarea>
                    <br><br>
                    <button type="submit">Submit Report</button>
                </form>
                <p id="civicMessage"></p>
            </section>
            <p><a href="/templates/dashboard.html"></a>Back to Dashboard</p>
        </main>
        <script src="/static/js/civic_voice.js"></script>
    </body>
</html>
