<!DOCTYPE html>
<html>
    <head>
        <title>KARTAVYA - Login</title>
        <link rel="stylesheet" href="/static/css/style.css">
    </head>
    <body>
        <header>
            <h1>Welcome Back!</h1>
            <p>Login to your KARTAVYA Account</p>
        </header>
        <main>
            <form id="loginForm" method="POST" action="/login">
                <label>Email:</label>
                <input type="email" id="loginEmail" name="email" placeholder="Enetr your email" required>
                <br><br>
                <label>Password:</label>
                <input type="password" id="loginPassword" name="password" placeholder="Enter your password" required>
                <br><br>
                <button type="submit">Login</button>
            </form>
            <p id="loginMessage">Don't have an account?<a href="/templates/register.html">Register here</a></p>
            <p><a href="/">Back to Home</a></p>
        </main>
        <script src="/static/js/login.js"></script>
    </body>
</html>
